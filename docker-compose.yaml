services:
  chromadb:
    image: chromadb/chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER}
      AZURE_STORAGE_SAS_URL: ${AZURE_STORAGE_SAS_URL}
    ports:
      - "5000:5000"
    depends_on:
      - chromadb
    volumes:
      - ./chat_logs:/app/chat_logs
      - ./pdf_store:/app/pdf_store

  chatbot:
    build:
      context: .
      dockerfile: Dockerfile.chatbot
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  chromadb_data: